name: CodSpeed

on:
  push:
    branches: [main]
  pull_request:
  # Lets CodSpeed trigger a backtest run to seed the initial performance data.
  workflow_dispatch:

concurrency:
  group: codspeed-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OpenID Connect authentication with CodSpeed
    env:
      UV_PYTHON: '3.12'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # `-n 0` opts out of the xdist default in pyproject.toml: the measurement
      # must happen in a single process.
      - name: Run benchmarks
        uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f # v5.6.3
        with:
          mode: simulation
          run: uv run --no-sync pytest benchmarks --codspeed -n 0
