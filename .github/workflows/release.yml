name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # First and cheapest: a tag that does not match interlock/version.py
      # must never reach the publish job. `TAG` goes through env, not
      # straight into the script, so a tag name cannot be read as shell.
      - name: Verify tag matches package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 -c "
          import re
          text = open('interlock/version.py').read()
          print(re.search(r\"VERSION = '([^']+)'\", text)[1])
          ")
          if [ "${TAG}" != "v${version}" ]; then
            echo "::error::tag ${TAG} does not match package version v${version}"
            exit 1
          fi
          echo "tag ${TAG} matches package version v${version}"

      # No cache here, unlike the other workflows: a cache entry written by a
      # pull-request run would be readable by the job that builds the published
      # artefacts. One `uv sync` per release is cheaper than that risk.
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false

      - name: Install dependencies
        run: uv sync --frozen

      - name: Tests
        run: uv run pytest

      - name: Build sdist and wheel
        run: uv build

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      # `attestations` defaults to true, but PEP 740 provenance is the point of
      # the OIDC flow — state it so a default flip cannot silently drop it.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          attestations: true

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
