name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # First and cheapest: a tag that does not match interlock/version.py
      # must never reach the publish job. `TAG` goes through env, not
      # straight into the script, so a tag name cannot be read as shell.
      - name: Verify tag matches package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 -c "
          import re
          text = open('interlock/version.py').read()
          print(re.search(r\"VERSION = '([^']+)'\", text)[1])
          ")
          if [ "${TAG}" != "v${version}" ]; then
            echo "::error::tag ${TAG} does not match package version v${version}"
            exit 1
          fi
          echo "tag ${TAG} matches package version v${version}"

      # No cache here, unlike the other workflows: a cache entry written by a
      # pull-request run would be readable by the job that builds the published
      # artefacts. One `uv sync` per release is cheaper than that risk.
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Install dependencies
        run: uv sync --frozen

      - name: Tests
        run: uv run pytest

      - name: Build sdist and wheel
        run: uv build

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      # `attestations` defaults to true, but PEP 740 provenance is the point of
      # the OIDC flow — state it so a default flip cannot silently drop it.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
